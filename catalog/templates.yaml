# Quarto Kit template catalog — source of truth.
# Edit this file, then run: python3 scripts/qk update-docs
# Propose new entries via PR. Do not auto-merge external candidates.
# License: documentation CC BY-SA 4.0 (LICENSE); code MIT (LICENSE-CODE).
# PHI: never commit PHI; use mock or de-identified data only.
#
# Entry kinds
# -----------
# Every entry has: id, title, description, tags, kind, when_to_use.
#
#   kind: file | directory
#     A template stored in this repo. Requires `path` (relative to repo root).
#     `qk install <id> [dest]` copies it.
#
#   kind: extension-project-type
#     A Quarto project type contributed by an upstream extension (lives in
#     another repo; nothing is vendored here). No `path`. Fields:
#       install:      required, exactly `quarto add owner/repo` (optional @ref)
#       project_type: required, value for `project: type:` in _quarto.yml
#       base_type:    optional, Quarto base type it inherits (default|website|book)
#       min_quarto:   required, minimum Quarto version (e.g. 1.9.36); match the
#                     extension's `quarto-required` in _extension.yml
#       source:       required, upstream repository URL
#       docs:         optional, documentation / announcement URL
#       usage:        optional, minimal _quarto.yml (literal block, |)
#       notes:        optional, caveats and update policy
#     `qk install <id> [project-dir]` runs the `install` command in project-dir
#     (`--dry-run` prints it). `qk check` compares the local Quarto version
#     with every min_quarto.

version: 1
templates:
  - id: claude-md-global
    title: Global CLAUDE.md
    description: >
      Cross-project Claude Code context for ~/projects (or similar root).
      Covers txtarchive, analysis numbering, Quarto pointers, and ontology
      bootstrap conventions. Copy to your projects root and fill placeholders.
    path: templates/claude-md-global.md
    tags: [claude-code, bootstrap, markdown]
    kind: file
    when_to_use: >
      New machine setup or when establishing shared global Claude Code context
      across multiple projects.

  - id: claude-md-project
    title: Project CLAUDE.md
    description: >
      Project-level CLAUDE.md scaffold with data sources, key outcome, analysis
      progression, packages, gotchas, profiling protocol, and review checklist.
      Placeholders use {ALL_CAPS} form.
    path: templates/claude-md-project.md
    tags: [claude-code, bootstrap, markdown, project]
    kind: file
    when_to_use: >
      Starting or upgrading a project that needs a short, decision-oriented
      CLAUDE.md (not a dump of reference material).

  - id: settings-local-project
    title: Project settings.local.json
    description: >
      Minimal Claude Code project permissions allow-list (WebSearch, git, gh,
      txtarchive). Copy to .claude/settings.local.json and tighten for the
      project stack (R, Python, or minimal).
    path: templates/settings-local-project.json
    tags: [claude-code, bootstrap, json, permissions]
    kind: file
    when_to_use: >
      Bootstrapping .claude/ permissions for a new or older project.

  - id: ontology-scaffold
    title: Ontology scaffold
    description: >
      Directory template for ontology-driven Claude Code configuration:
      CLAUDE.md.template plus rules/ (schema, constraints, assumptions,
      authority scoring, method tree, validation gates, output conventions).
      Replace {PLACEHOLDERS} after install.
    path: templates/ontology-scaffold
    tags: [claude-code, ontology, scaffold, directory]
    kind: directory
    when_to_use: >
      When a project outgrows a flat CLAUDE.md and needs typed constraints,
      assumption tracking, and validation gates (architecture review Level 1+).

  - id: research-paper-starter-pack
    title: Research paper starter pack
    description: >
      Quarto manuscript starter (ZIP + README) wired for DOCX/PDF with
      manuscript.yml, section includes, BibTeX, and CSL placeholder. Unzip,
      replace CSL/journal reference as needed, then quarto render.
    path: templates/research-paper-starter-pack
    tags: [quarto, manuscript, research, directory]
    kind: directory
    when_to_use: >
      Starting a Quarto research paper / manuscript with citation and
      multi-format output scaffolding.

  - id: atelier
    title: Atelier documentation-website project type (mcanouil/quarto-atelier)
    description: >
      Quarto extension by Mickaël Canouil that contributes the `atelier` project
      type, a `website` underneath. A site's _quarto.yml only needs
      `project: type: atelier` plus its title, URLs, and navbar. The extension
      supplies the footer, a light/dark theme driven by the site's _brand.yml,
      Open Graph and Twitter card tags, a search overlay in the navbar,
      llms.txt, page navigation, and accessibility scripts (skip link and
      fixes). Configuration and styling only; it carries no data.
    tags: [quarto, extension, project-type, website, documentation, brand]
    kind: extension-project-type
    install: quarto add mcanouil/quarto-atelier
    project_type: atelier
    base_type: website
    min_quarto: 1.9.36
    source: https://github.com/mcanouil/quarto-atelier
    docs: https://mickael.canouil.fr/posts/2026-10-05-quarto-atelier-project-type/
    usage: |
      project:
        type: atelier

      website:
        title: "My Site"
        site-url: https://example.org/my-site
        repo-url: https://github.com/example/my-site
        navbar:
          left:
            - href: index.qmd
              text: Home

      # Quarto does not pass the website block to filters, so repeat the URL
      # here for the og:url tag.
      extensions:
        atelier:
          site-url: https://example.org/my-site
    notes: >
      Overrides merge key by key and the site wins (e.g. move search to the
      sidebar with website.search.location). List settings such as
      include-after-body scripts and filters stack with the extension's and
      cannot be removed; if a site needs to drop one, that default does not
      belong in a shared project type. Every site moves with the extension, so
      a bad default reaches all of them: each site keeps its own copy under
      _extensions/ (commit it), and upstream keeps sites current with a monthly
      Quarto Extensions Updater pull request that is reviewed before merge.
      atelier carries the author's own choices (en-GB locale, his footer); it
      is a model for writing your own project type (e.g. a branded team
      docs/report site), not necessarily one to adopt as-is. Upstream README
      pins a release, e.g. `quarto add mcanouil/quarto-atelier@0.10.5`.
    when_to_use: >
      Standing up a documentation website with consistent chrome from a short
      _quarto.yml, or as the reference implementation when building your own
      extension-provided project type to share one configuration across many
      repos.
